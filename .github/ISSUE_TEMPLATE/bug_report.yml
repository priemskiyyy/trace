name: Bug report
description: Report incorrect behavior with a reproducible example.
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link a minimal repository or provide steps and a small code example. Include the Trace configuration, the destinations involved, and whether the event was tracked before `start()`.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: Include Trace packages, the provider SDK and its version, framework, browser, Node or React Native version, and operating system.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Receipt and diagnostics
      description: Include the receipt's settled status and the devtools timeline or `trace.diagnostics` events for the event. Diagnostics hold no event content, but remove tokens, credentials and personal data from anything else you paste.
